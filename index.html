<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Circula | Marketplace Limbah Industri Sirkular</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        /* ==========================================================================
   Circula Design System & Theme Variables
   ========================================================================== */
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);

            /* Primary Emerald Eco Palette */
            --p: #15803d;
            --p-rgb: 21, 128, 61;
            --p-hover: #166534;
            --on-p: #ffffff;
            --pc: #dcfce7;
            --on-pc: #14532d;
            --lime: #10b981;
            --on-lime: #ffffff;

            /* Neutrals & Surfaces (Clean Modern Slate) */
            --s: #f8fafc;
            --sc: #ffffff;
            --sch: #f1f5f9;
            --on-s: #0f172a;
            --on-sv: #64748b;
            --ol: #e2e8f0;
            --olv: #cbd5e1;

            /* Component Colors */
            --tile: #065f46;
            --tile-ic: #a7f3d0;
            --card-bg: #ffffff;
            --row: #ffffff;
            --row-hover: #f8fafc;
            --water: #bae6fd;
            --road: #e2e8f0;
            --zone: #e2fbe8;

            /* States & Semantics */
            --err: #dc2626;
            --errc: #fee2e2;
            --warn: #d97706;
            --warnc: #fef3c7;
            --info: #0284c7;
            --infoc: #e0f2fe;

            /* Modern Glass & Elevation */
            --elev-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
            --elev: 0 4px 16px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
            --elev-lg: 0 16px 36px -4px rgba(15, 23, 42, 0.1), 0 6px 12px -2px rgba(15, 23, 42, 0.04);
            --elev-hover: 0 12px 28px -4px rgba(21, 128, 61, 0.14), 0 4px 10px -2px rgba(0, 0, 0, 0.04);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-full: 9999px;

            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --p: #22c55e;
                --p-rgb: 34, 197, 94;
                --p-hover: #4ade80;
                --on-p: #052e16;
                --pc: #064e3b;
                --on-pc: #86efac;
                --lime: #34d399;
                --on-lime: #022c22;

                --s: #09110e;
                --sc: #13221b;
                --sch: #1b2f26;
                --on-s: #f1f5f9;
                --on-sv: #94a3b8;
                --ol: #243c31;
                --olv: #1b2f26;

                --tile: #064e3b;
                --tile-ic: #6ee7b7;
                --card-bg: #13221b;
                --row: #13221b;
                --row-hover: #1c2e25;
                --water: #0c2838;
                --road: #1c2f26;
                --zone: #142e22;

                --err: #f87171;
                --errc: #450a0a;
                --warn: #fbbf24;
                --warnc: #451a03;
                --info: #38bdf8;
                --infoc: #082f49;

                --elev-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
                --elev: 0 6px 20px rgba(0, 0, 0, 0.35);
                --elev-lg: 0 18px 40px rgba(0, 0, 0, 0.5);
                --elev-hover: 0 12px 30px rgba(34, 197, 94, 0.16);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --p: #22c55e;
            --p-rgb: 34, 197, 94;
            --p-hover: #4ade80;
            --on-p: #052e16;
            --pc: #064e3b;
            --on-pc: #86efac;
            --lime: #34d399;
            --on-lime: #022c22;

            --s: #09110e;
            --sc: #13221b;
            --sch: #1b2f26;
            --on-s: #f1f5f9;
            --on-sv: #94a3b8;
            --ol: #243c31;
            --olv: #1b2f26;

            --tile: #064e3b;
            --tile-ic: #6ee7b7;
            --card-bg: #13221b;
            --row: #13221b;
            --row-hover: #1c2e25;
            --water: #0c2838;
            --road: #1c2f26;
            --zone: #142e22;

            --err: #f87171;
            --errc: #450a0a;
            --warn: #fbbf24;
            --warnc: #451a03;
            --info: #38bdf8;
            --infoc: #082f49;

            --elev-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
            --elev: 0 6px 20px rgba(0, 0, 0, 0.35);
            --elev-lg: 0 18px 40px rgba(0, 0, 0, 0.5);
            --elev-hover: 0 12px 30px rgba(34, 197, 94, 0.16);
            color-scheme: dark;
        }

        /* ==========================================================================
   Base & Typography
   ========================================================================== */
        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
            height: 100%;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100%;
            background: var(--s);
            color: var(--on-s);
            font: 400 15px/1.6 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1,
        h2,
        h3,
        h4,
        p,
        dl,
        dd,
        ul {
            margin: 0;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
            background: none;
            border: none;
        }

        :focus-visible {
            outline: 2px solid var(--p);
            outline-offset: 2px;
        }

        .ic {
            flex: none;
            display: block;
        }

        h1,
        h2,
        h3,
        h4,
        .disp {
            font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--on-s);
        }

        .sub {
            color: var(--on-sv);
            font-size: 13.5px;
            line-height: 1.4;
        }

        .grow {
            flex: 1;
        }

        /* ==========================================================================
   Main Layout & Animations
   ========================================================================== */
        main {
            min-height: 100vh;
            padding-bottom: 120px;
            animation: viewFadeIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes viewFadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            main {
                animation: none;
            }
        }

        .page {
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 18px 32px;
        }

        .bare main {
            padding-bottom: 0;
        }

        .bare .bottombar,
        .bare .rail,
        .bare .fab {
            display: none !important;
        }

        /* Top App Bar */
        .appbar {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 64px;
            padding: 0 16px;
            background: color-mix(in srgb, var(--s) 88%, transparent);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid color-mix(in srgb, var(--ol) 60%, transparent);
        }

        .appbar.nb {
            padding-left: 20px;
        }

        .appbar h1 {
            font-size: 20px;
            line-height: 1.25;
            font-weight: 700;
        }

        .icbtn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid transparent;
            background: transparent;
            display: grid;
            place-items: center;
            color: var(--on-sv);
            transition: all 0.18s ease;
        }

        .icbtn:hover {
            background: var(--sch);
            color: var(--on-s);
            border-color: var(--ol);
        }

        .icbtn:active {
            transform: scale(0.94);
        }

        .fav.on {
            color: var(--err);
        }

        /* Bottom Navigation (Mobile) */
        .bottombar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            display: flex;
            background: color-mix(in srgb, var(--sc) 92%, transparent);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px 10px calc(12px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--ol);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
        }

        .navi {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--on-sv);
            transition: color 0.15s ease;
            padding: 4px 0;
        }

        .navi .pill {
            width: 54px;
            height: 32px;
            border-radius: var(--radius-full);
            display: grid;
            place-items: center;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .navi.on {
            color: var(--p);
        }

        .navi.on .pill {
            background: var(--pc);
            color: var(--on-pc);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(var(--p-rgb), 0.18);
        }

        /* Rail Navigation (Desktop) */
        .rail {
            display: none;
        }

        .fab {
            position: fixed;
            right: 20px;
            bottom: calc(96px + env(safe-area-inset-bottom, 0px));
            z-index: 25;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            height: 52px;
            padding: 0 22px 0 18px;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, var(--lime), var(--p));
            color: #ffffff;
            font-weight: 600;
            font-size: 14.5px;
            box-shadow: 0 8px 24px rgba(var(--p-rgb), 0.35);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .fab:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(var(--p-rgb), 0.45);
        }

        .fab:active {
            transform: scale(0.97);
        }

        @media (min-width: 860px) {
            .bottombar {
                display: none;
            }

            .rail {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: 92px;
                z-index: 30;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                padding: calc(20px + env(safe-area-inset-top, 0px)) 0 20px;
                background: var(--sc);
                border-right: 1px solid var(--ol);
            }

            .rail .navi {
                flex: none;
                width: 78px;
                padding: 6px 0;
                border-radius: var(--radius-md);
            }

            .rail .navi:hover {
                color: var(--on-s);
                background: var(--sch);
            }

            .rail .logo {
                color: var(--p);
                margin-bottom: 12px;
                cursor: pointer;
                transition: transform 0.25s ease;
            }

            .rail .logo:hover {
                transform: rotate(20deg);
            }

            main {
                margin-left: 92px;
                padding-bottom: 48px;
            }

            .bare main {
                margin-left: 0;
            }

            .fab {
                bottom: 32px;
                right: 32px;
            }

            .page {
                padding: 0 36px 40px;
            }
        }

        /* ==========================================================================
   Buttons & Interactive Elements
   ========================================================================== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 46px;
            padding: 0 22px;
            border-radius: var(--radius-full);
            border: 1px solid transparent;
            font-weight: 600;
            font-size: 14.5px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn.fill {
            background: var(--p);
            color: var(--on-p);
            box-shadow: 0 2px 8px rgba(var(--p-rgb), 0.25);
        }

        .btn.fill:hover {
            background: var(--p-hover);
            box-shadow: 0 6px 16px rgba(var(--p-rgb), 0.35);
            transform: translateY(-1px);
        }

        .btn.tonal {
            background: var(--pc);
            color: var(--on-pc);
        }

        .btn.tonal:hover {
            background: color-mix(in srgb, var(--pc) 85%, var(--p));
            transform: translateY(-1px);
        }

        .btn.outline {
            background: transparent;
            border-color: var(--ol);
            color: var(--on-s);
        }

        .btn.outline:hover {
            border-color: var(--p);
            color: var(--p);
            background: color-mix(in srgb, var(--pc) 40%, transparent);
        }

        .btn.text {
            background: transparent;
            color: var(--p);
            padding: 0 14px;
        }

        .btn.text:hover {
            background: var(--sch);
        }

        .btn.block {
            width: 100%;
        }

        .btn.danger {
            color: var(--err);
            border-color: var(--err);
        }

        .btn.danger:hover {
            background: var(--errc);
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Form Fields & Inputs */
        .search {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 52px;
            padding: 0 18px;
            border-radius: var(--radius-full);
            background: var(--sc);
            border: 1px solid var(--ol);
            color: var(--on-sv);
            box-shadow: var(--elev-sm);
            transition: all 0.2s ease;
        }

        .search:focus-within {
            border-color: var(--p);
            box-shadow: 0 0 0 3px rgba(var(--p-rgb), 0.15);
            color: var(--p);
        }

        .search input {
            flex: 1;
            min-width: 0;
            border: 0;
            background: transparent;
            outline: 0;
            color: var(--on-s);
            font-size: 14.5px;
        }

        .search input::placeholder {
            color: var(--on-sv);
        }

        .fld {
            display: block;
            margin-bottom: 18px;
        }

        .fld>span {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--on-s);
        }

        .fld input,
        .fld select,
        .fld textarea {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--ol);
            background: var(--sc);
            color: var(--on-s);
            outline: 0;
            font-size: 14.5px;
            transition: all 0.2s ease;
        }

        .fld textarea {
            height: 100px;
            padding: 12px 16px;
            resize: vertical;
        }

        .fld input:focus,
        .fld select:focus,
        .fld textarea:focus {
            border-color: var(--p);
            box-shadow: 0 0 0 3px rgba(var(--p-rgb), 0.15);
        }

        .fld select option {
            background: var(--sc);
            color: var(--on-s);
        }

        .fld small {
            display: block;
            margin-top: 5px;
            color: var(--on-sv);
            font-size: 12.5px;
        }

        .err {
            color: var(--err);
            font-size: 13px;
            margin: 6px 0 12px;
            min-height: 18px;
            font-weight: 500;
        }

        .chk {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            font-size: 13.5px;
            color: var(--on-sv);
            cursor: pointer;
            margin: 16px 0;
            line-height: 1.45;
        }

        .chk input {
            margin-top: 3px;
            width: 18px;
            height: 18px;
            accent-color: var(--p);
            flex: none;
        }

        /* Range input styling */
        input[type=range] {
            width: 100%;
            accent-color: var(--p);
            height: 28px;
            cursor: pointer;
        }

        /* Chips & Segmented Controls */
        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 0;
            scrollbar-width: none;
        }

        .chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 36px;
            padding: 0 14px;
            border-radius: var(--radius-full);
            border: 1px solid var(--ol);
            background: var(--sc);
            color: var(--on-sv);
            font-size: 13.5px;
            font-weight: 600;
            transition: all 0.18s ease;
        }

        .chip:hover {
            background: var(--sch);
            color: var(--on-s);
            border-color: var(--olv);
        }

        .chip.on {
            background: var(--pc);
            color: var(--on-pc);
            border-color: rgba(var(--p-rgb), 0.25);
            box-shadow: 0 2px 6px rgba(var(--p-rgb), 0.12);
        }

        .seg {
            display: flex;
            background: var(--sch);
            border: 1px solid var(--ol);
            border-radius: var(--radius-full);
            padding: 4px;
            gap: 4px;
        }

        .seg button {
            flex: 1;
            height: 38px;
            border-radius: var(--radius-full);
            border: 0;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--on-sv);
            transition: all 0.2s ease;
        }

        .seg button:hover {
            color: var(--on-s);
        }

        .seg button.on {
            background: var(--sc);
            color: var(--on-s);
            box-shadow: var(--elev-sm);
        }

        /* ==========================================================================
   Card System & Component Styles
   ========================================================================== */
        .card {
            background: var(--sc);
            border: 1px solid var(--ol);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--elev);
            transition: all 0.2s ease;
        }

        .card.pc {
            background: linear-gradient(135deg, color-mix(in srgb, var(--pc) 40%, var(--sc)), var(--sc));
            border-color: color-mix(in srgb, var(--p) 25%, var(--ol));
        }

        .sec {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin: 28px 0 14px;
        }

        .sec h2 {
            font-size: 18px;
        }

        .sec a {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--p);
        }

        .sec a:hover {
            text-decoration: underline;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 24px;
            padding: 0 10px;
            border-radius: var(--radius-full);
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            background: var(--pc);
            color: var(--on-pc);
        }

        .badge.warn {
            background: var(--warnc);
            color: var(--warn);
        }

        .badge.info {
            background: var(--infoc);
            color: var(--info);
        }

        /* Material Image & Tile Component */
        .tile {
            position: relative;
            overflow: hidden;
            background: var(--tile);
            color: var(--tile-ic);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
        }

        .tile img.tile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tile .tile-fallback {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--tile), color-mix(in srgb, var(--tile) 70%, #000));
        }

        .tile .tile-fallback.hide,
        .tile img.hide {
            display: none !important;
        }

        .tile svg {
            width: 50%;
            height: 50%;
            opacity: 0.9;
        }

        .tile.sm {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            flex: none;
        }

        .tile.sm svg {
            width: 24px;
            height: 24px;
        }

        /* Catalog Card (Grid) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .lcard {
            position: relative;
            background: var(--sc);
            border: 1px solid var(--ol);
            border-radius: var(--radius-lg);
            padding: 10px;
            box-shadow: var(--elev-sm);
            display: flex;
            flex-direction: column;
            transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lcard:hover {
            transform: translateY(-4px);
            box-shadow: var(--elev-hover);
            border-color: color-mix(in srgb, var(--p) 35%, var(--ol));
        }

        .lcard:hover .tile img.tile-img {
            transform: scale(1.05);
        }

        .lc-img {
            position: relative;
            border-radius: calc(var(--radius-lg) - 6px);
            overflow: hidden;
        }

        .lc-img .tile {
            aspect-ratio: 4/3;
            width: 100%;
            border-radius: calc(var(--radius-lg) - 6px);
        }

        .lc-img .fav {
            position: absolute;
            right: 6px;
            top: 6px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            color: #475569;
            border-radius: 50%;
            z-index: 3;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .lc-img .fav:hover {
            transform: scale(1.1);
        }

        .lc-img .fav.on {
            color: var(--err);
        }

        .lc-img .gr {
            position: absolute;
            left: 8px;
            bottom: 8px;
            height: 24px;
            padding: 0 8px;
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            letter-spacing: 0.03em;
        }

        .lc-b {
            padding: 12px 6px 6px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .lc-b h3 {
            font-size: 15px;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.7em;
            margin-bottom: 6px;
        }

        .lc-b .pr {
            font-size: 17px;
            font-weight: 800;
            color: var(--p);
            margin-bottom: 8px;
        }

        .lc-b .pr small {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--on-sv);
        }

        .meta {
            display: flex;
            gap: 12px;
            font-size: 12.5px;
            color: var(--on-sv);
            margin-top: auto;
        }

        .meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* List Row Item */
        .row {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--row);
            border: 1px solid var(--ol);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 10px;
            box-shadow: var(--elev-sm);
            transition: all 0.2s ease;
        }

        .row:hover {
            background: var(--sch);
            border-color: color-mix(in srgb, var(--p) 35%, var(--ol));
            transform: translateX(3px);
        }

        .row .tile {
            width: 58px;
            height: 58px;
            border-radius: 12px;
            flex: none;
        }

        .rowb {
            flex: 1;
            min-width: 0;
        }

        .rowb h3 {
            font-size: 15px;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rowp {
            text-align: right;
            flex: none;
        }

        .rowp strong {
            display: block;
            font-size: 15.5px;
            font-weight: 800;
            color: var(--p);
        }

        .rowp small {
            font-size: 12px;
            color: var(--on-sv);
        }

        .stretch {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* Home Screen Enhancements */
        .hello {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 4px 14px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--lime), var(--p));
            color: #ffffff;
            display: grid;
            place-items: center;
            font: 700 17px 'Outfit', sans-serif;
            flex: none;
            box-shadow: 0 4px 12px rgba(var(--p-rgb), 0.25);
        }

        .hello h1 {
            font-size: 21px;
            line-height: 1.25;
        }

        .quick {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .quick a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            color: var(--on-s);
            transition: transform 0.2s ease;
        }

        .quick a:hover {
            transform: translateY(-2px);
            color: var(--p);
        }

        .quick .c {
            width: 58px;
            height: 58px;
            border-radius: 20px;
            background: var(--sc);
            border: 1px solid var(--ol);
            color: var(--p);
            display: grid;
            place-items: center;
            box-shadow: var(--elev-sm);
            transition: all 0.2s ease;
        }

        .quick a:hover .c {
            background: var(--pc);
            border-color: color-mix(in srgb, var(--p) 30%, transparent);
            box-shadow: 0 8px 18px rgba(var(--p-rgb), 0.18);
        }

        .carousel {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            margin: 0 -18px;
            padding: 6px 18px 14px;
            scrollbar-width: none;
        }

        .carousel::-webkit-scrollbar {
            display: none;
        }

        .hcard {
            position: relative;
            flex: none;
            width: min(80%, 300px);
            scroll-snap-align: start;
            background: var(--sc);
            border: 1px solid var(--ol);
            border-radius: var(--radius-lg);
            padding: 10px;
            box-shadow: var(--elev);
            transition: all 0.22s ease;
        }

        .hcard:hover {
            transform: translateY(-4px);
            box-shadow: var(--elev-hover);
            border-color: color-mix(in srgb, var(--p) 35%, var(--ol));
        }

        .hcard .tile {
            aspect-ratio: 16/11;
            border-radius: calc(var(--radius-lg) - 6px);
        }

        .hcard h3 {
            font-size: 16px;
            line-height: 1.35;
            margin: 12px 6px 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hcard .pr {
            font-size: 17px;
            font-weight: 800;
            color: var(--p);
            margin: 0 6px 8px;
        }

        .hcard .meta {
            margin: 0 6px 6px;
        }

        .stat3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 14px;
        }

        .stat3 div {
            background: var(--sc);
            border: 1px solid var(--ol);
            border-radius: var(--radius-md);
            padding: 14px 8px;
            text-align: center;
        }

        .stat3 b {
            display: block;
            font: 800 20px 'Outfit', sans-serif;
            color: var(--p);
        }

        .stat3 small {
            font-size: 12px;
            color: var(--on-sv);
            font-weight: 500;
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 4px;
            border-bottom: 1px solid var(--ol);
        }

        .price-row:last-child {
            border-bottom: 0;
        }

        .up {
            color: var(--p);
            font-weight: 600;
        }

        .down {
            color: var(--err);
            font-weight: 600;
        }

        .cta {
            display: flex;
            gap: 18px;
            align-items: center;
            background: linear-gradient(135deg, var(--pc), color-mix(in srgb, var(--lime) 25%, var(--pc)));
            color: var(--on-pc);
            border: 1px solid color-mix(in srgb, var(--p) 20%, transparent);
            border-radius: var(--radius-lg);
            padding: 22px;
            margin-top: 32px;
            box-shadow: var(--elev);
            transition: transform 0.2s ease;
        }

        .cta:hover {
            transform: translateY(-2px);
        }

        .cta h3 {
            font-size: 18px;
            margin-bottom: 4px;
            color: var(--on-pc);
        }

        /* ==========================================================================
   Splash, Onboarding, Auth
   ========================================================================== */
        .splash {
            min-height: 100vh;
            min-height: 100svh;
            background: radial-gradient(circle at 50% 20%, #15803d, #064e3b 80%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 24px calc(40px + env(safe-area-inset-bottom, 0px));
        }

        .sp-mid {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 12px;
            max-width: 480px;
        }

        .sp-mid .badge-hero {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 12.5px;
            font-weight: 600;
            color: #bbf7d0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sp-mid h1 {
            font-size: 54px;
            line-height: 1;
            color: #ffffff;
            margin-top: 4px;
        }

        .sp-mid p {
            font-size: 18px;
            max-width: 26ch;
            opacity: 0.9;
            line-height: 1.45;
        }

        .sp-btm {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: min(380px, 100%);
            align-items: stretch;
        }

        .sp-btm .btn.fill {
            background: #ffffff;
            color: #14532d;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .sp-btm .btn.fill:hover {
            background: #f0fdf4;
        }

        .sp-btm .btn.outline {
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }

        .sp-btm .btn.outline:hover {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .sp-btm .btn.text {
            color: #bbf7d0;
        }

        .splash .logo {
            animation: spin 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        @keyframes spin {
            from {
                transform: rotate(-220deg) scale(0.6);
                opacity: 0;
            }

            to {
                transform: none;
                opacity: 1;
            }
        }

        .narrow {
            width: min(440px, 100%);
            margin: 0 auto;
            padding: 0 16px;
        }

        .auth h1 {
            font-size: 28px;
            text-align: center;
            padding: 40px 0 20px;
        }

        .ob {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 36px 24px calc(32px + env(safe-area-inset-bottom, 0px));
        }

        .ob .head {
            width: min(440px, 100%);
            text-align: center;
        }

        .ob h1 {
            font-size: 26px;
            line-height: 1.25;
            margin: 16px 0 8px;
        }

        .ob .art {
            width: min(320px, 80%);
            margin: 24px auto;
        }

        .ob .art .tile {
            aspect-ratio: 4/3;
            border-radius: var(--radius-lg);
            box-shadow: var(--elev-lg);
        }

        .ob .art .tile img.tile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ob .foot {
            width: min(440px, 100%);
            margin-top: auto;
        }

        .dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 18px 0;
        }

        .dots i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--olv);
            transition: all 0.25s ease;
        }

        .dots i.on {
            background: var(--p);
            width: 24px;
            border-radius: 4px;
        }

        /* ==========================================================================
   Detail Listing Page
   ========================================================================== */
        .detail {
            display: grid;
            gap: 24px;
        }

        .d-img .tile {
            aspect-ratio: 4/3;
            border-radius: var(--radius-lg);
            box-shadow: var(--elev);
            overflow: hidden;
        }

        .d-img .tile img.tile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .d-info h2 {
            font-size: 26px;
            line-height: 1.25;
            margin: 10px 0 6px;
        }

        .price {
            font: 800 28px 'Outfit', sans-serif;
            color: var(--p);
            margin-bottom: 12px;
        }

        .price small {
            font: 500 15px 'Plus Jakarta Sans', sans-serif;
            color: var(--on-sv);
        }

        .lead {
            margin: 12px 0 18px;
            color: var(--on-sv);
            line-height: 1.6;
        }

        .specs {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 12px 16px;
            margin: 18px 0;
            font-size: 14.5px;
            background: var(--sc);
            border: 1px solid var(--ol);
            border-radius: var(--radius-md);
            padding: 16px;
        }

        .specs dt {
            color: var(--on-sv);
        }

        .specs dd {
            font-weight: 600;
            text-align: right;
            color: var(--on-s);
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 18px 0;
        }

        .two .card b {
            display: block;
            font: 800 20px 'Outfit', sans-serif;
            color: var(--p);
            margin-bottom: 4px;
        }

        .two .card small {
            color: var(--on-sv);
            font-size: 12px;
        }

        .seller {
            display: flex;
            gap: 14px;
            align-items: center;
            margin: 18px 0;
        }

        .seller .avatar {
            width: 48px;
            height: 48px;
        }

        .acts {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .acts .btn {
            flex: 1;
            min-width: 140px;
        }

        @media (min-width: 860px) {
            .detail {
                grid-template-columns: 1.1fr 1fr;
                align-items: start;
                gap: 36px;
            }

            .d-img {
                position: sticky;
                top: 84px;
            }
        }

        /* ==========================================================================
   Interactive Map System
   ========================================================================== */
        .peta {
            display: grid;
            gap: 0;
        }

        .mapbox {
            position: relative;
            height: 46vh;
            min-height: 330px;
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            overflow: hidden;
            background: var(--sc);
            border: 1px solid var(--ol);
            box-shadow: var(--elev);
        }

        .mapsvg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .me {
            position: absolute;
            left: 50%;
            top: 55%;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--lime);
            border: 3px solid #ffffff;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.4);
            z-index: 3;
        }

        .me::before {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: var(--lime);
            animation: pulseRadar 2s infinite ease-out;
            z-index: -1;
        }

        @keyframes pulseRadar {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
            }

            100% {
                transform: scale(2.6);
                opacity: 0;
            }
        }

        .me-l {
            position: absolute;
            left: 50%;
            top: 55%;
            transform: translate(-50%, 16px);
            font-size: 11px;
            font-weight: 700;
            background: var(--sc);
            color: var(--on-s);
            padding: 2px 8px;
            border-radius: 6px;
            box-shadow: var(--elev-sm);
            white-space: nowrap;
            z-index: 3;
            border: 1px solid var(--ol);
        }

        .pin {
            position: absolute;
            transform: translate(-50%, -100%);
            border: 0;
            background: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .pin:hover {
            transform: translate(-50%, -108%) scale(1.1);
            z-index: 5;
        }

        .pin .pb {
            width: 38px;
            height: 38px;
            border-radius: 50% 50% 50% 6px;
            transform: rotate(-45deg);
            background: var(--p);
            color: #ffffff;
            display: grid;
            place-items: center;
            box-shadow: var(--elev);
            border: 2px solid #ffffff;
        }

        .pin .pb svg {
            transform: rotate(45deg);
            width: 20px;
            height: 20px;
        }

        .pin.on {
            z-index: 5;
            transform: translate(-50%, -105%) scale(1.15);
        }

        .pin.on .pb {
            background: #0f172a;
            color: #38bdf8;
            width: 44px;
            height: 44px;
            border-color: #38bdf8;
        }

        .pin .lab {
            position: absolute;
            bottom: 100%;
            margin-bottom: 6px;
            white-space: nowrap;
            background: var(--sc);
            color: var(--on-s);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: var(--elev);
            border: 1px solid var(--ol);
        }

        .mapchips {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            padding: 10px 16px 0;
            z-index: 5;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.2), transparent);
        }

        .mapchips .chip {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            color: #0f172a;
            border-color: transparent;
        }

        .mapchips .chip.on {
            background: var(--p);
            color: #ffffff;
        }

        .sheet {
            padding: 18px 0;
        }

        .sheet .modes {
            margin-bottom: 16px;
        }

        .match {
            position: relative;
            background: var(--sc);
            border: 1px solid var(--ol);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            gap: 14px;
            box-shadow: var(--elev-sm);
            transition: all 0.2s ease;
        }

        .match:hover {
            border-color: var(--p);
            box-shadow: var(--elev);
        }

        .match.sel {
            border-color: var(--p);
            background: color-mix(in srgb, var(--pc) 25%, var(--sc));
            box-shadow: 0 0 0 2px var(--p);
        }

        .match .tile {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            flex: none;
        }

        .match h3 {
            font-size: 15.5px;
            line-height: 1.3;
        }

        .score {
            margin-left: auto;
            flex: none;
            align-self: flex-start;
            height: 26px;
            padding: 0 10px;
            border-radius: var(--radius-full);
            background: var(--pc);
            color: var(--on-pc);
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
        }

        .match .btn {
            height: 36px;
            font-size: 13.5px;
            padding: 0 16px;
            margin-top: 8px;
            position: relative;
            z-index: 2;
        }

        @media (min-width: 860px) {
            .peta {
                grid-template-columns: 1.25fr 1fr;
                gap: 28px;
                padding: 0 24px;
            }

            .mapbox {
                height: calc(100vh - 100px);
                border-radius: var(--radius-lg);
                position: sticky;
                top: 16px;
                margin-top: 16px;
            }

            .sheet {
                padding: 16px 0;
            }
        }

        /* ==========================================================================
   Carbon & Financial Calculator
   ========================================================================== */
        .circs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .circ {
            background: linear-gradient(135deg, var(--pc), color-mix(in srgb, var(--lime) 20%, var(--pc)));
            color: var(--on-pc);
            border: 1px solid color-mix(in srgb, var(--p) 25%, transparent);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 18px 8px;
            box-shadow: var(--elev-sm);
        }

        .circ b {
            font: 800 clamp(18px, 4vw, 26px)/1.1 'Outfit', sans-serif;
            color: var(--on-pc);
        }

        .circ small {
            font-size: clamp(11px, 2.5vw, 13px);
            line-height: 1.25;
            margin-top: 4px;
            opacity: 0.85;
        }

        .kv {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--ol);
            font-size: 14.5px;
        }

        .kv:last-child {
            border: 0;
        }

        .kv b {
            font-weight: 700;
            text-align: right;
            color: var(--on-s);
        }

        .note {
            font-size: 13px;
            color: var(--on-sv);
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin-top: 14px;
            line-height: 1.45;
        }

        @media (min-width: 860px) {
            .calcgrid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 36px;
                align-items: start;
            }
        }

        /* ==========================================================================
   Timeline & Transactions
   ========================================================================== */
        .steps {
            position: relative;
            margin: 16px 0;
        }

        .step {
            display: flex;
            gap: 16px;
            position: relative;
            padding-bottom: 22px;
        }

        .step:not(:last-child)::before {
            content: "";
            position: absolute;
            left: 15px;
            top: 32px;
            bottom: 0;
            width: 2px;
            background: var(--ol);
        }

        .step.done:not(:last-child)::before {
            background: var(--p);
        }

        .dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--ol);
            display: grid;
            place-items: center;
            flex: none;
            background: var(--sc);
            color: var(--on-sv);
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .step.done .dot {
            background: var(--p);
            border-color: var(--p);
            color: var(--on-p);
        }

        .step.cur .dot {
            border-color: var(--p);
            color: var(--p);
            box-shadow: 0 0 0 4px rgba(var(--p-rgb), 0.15);
        }

        .step .t {
            padding-top: 4px;
        }

        .step.todo .t {
            color: var(--on-sv);
        }

        .success {
            text-align: center;
            padding: 28px 12px;
        }

        .thumb {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 3px solid var(--p);
            color: var(--p);
            background: var(--pc);
            display: grid;
            place-items: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 24px rgba(var(--p-rgb), 0.2);
        }

        /* ==========================================================================
   Sustainability Certificate
   ========================================================================== */
        .cert {
            background: var(--sc);
            border: 2px solid var(--p);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--elev-lg);
        }

        .cert::before {
            content: "";
            position: absolute;
            inset: 8px;
            border: 1px dashed color-mix(in srgb, var(--p) 50%, transparent);
            border-radius: calc(var(--radius-lg) - 6px);
            pointer-events: none;
        }

        .cert h2 {
            font-size: 24px;
            text-align: center;
            margin: 14px 0 4px;
        }

        .cert .no {
            text-align: center;
            color: var(--on-sv);
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .cert .who {
            text-align: center;
            margin: 14px 0;
        }

        .cert .who b {
            font: 700 20px 'Outfit', sans-serif;
            display: block;
            color: var(--on-s);
        }

        .cert .qr {
            width: 84px;
            height: 84px;
            color: var(--on-s);
            flex: none;
        }

        .cert .foot {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 20px;
            font-size: 12.5px;
            color: var(--on-sv);
        }

        .demo-tag {
            position: absolute;
            right: -34px;
            top: 18px;
            transform: rotate(35deg);
            background: var(--warnc);
            color: var(--warn);
            font-size: 11px;
            font-weight: 700;
            padding: 2px 40px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* ==========================================================================
   Profile & About
   ========================================================================== */
        .prof {
            text-align: center;
            padding: 12px 0 16px;
        }

        .prof .big {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--lime), var(--p));
            color: #ffffff;
            display: grid;
            place-items: center;
            margin: 8px auto 14px;
            font: 800 34px 'Outfit', sans-serif;
            box-shadow: 0 8px 24px rgba(var(--p-rgb), 0.25);
        }

        .prof h2 {
            font-size: 22px;
        }

        .bars .b {
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 12px;
            align-items: center;
            margin: 12px 0;
            font-size: 13.5px;
        }

        .bars .track {
            height: 12px;
            border-radius: 6px;
            background: var(--sch);
            overflow: hidden;
        }

        .bars .fillb {
            height: 100%;
            background: linear-gradient(90deg, var(--lime), var(--p));
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .menu a,
        .menu button {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            min-height: 54px;
            padding: 0 18px;
            border: 1px solid var(--ol);
            background: var(--sc);
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            text-align: left;
            font-weight: 600;
            color: var(--on-s);
            box-shadow: var(--elev-sm);
            transition: all 0.18s ease;
        }

        .menu a:hover,
        .menu button:hover {
            background: var(--sch);
            border-color: var(--p);
            transform: translateX(3px);
        }

        .menu a span,
        .menu button span {
            flex: 1;
        }

        /* Dialog & Snackbar */
        .snack {
            position: fixed;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            bottom: calc(108px + env(safe-area-inset-bottom, 0px));
            z-index: 60;
            background: #0f172a;
            color: #f8fafc;
            padding: 12px 22px;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 500;
            max-width: min(92vw, 420px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .snack.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (min-width: 860px) {
            .snack {
                bottom: 32px;
                margin-left: 46px;
            }
        }

        dialog {
            border: 1px solid var(--ol);
            border-radius: var(--radius-lg);
            padding: 26px;
            background: var(--sc);
            color: var(--on-s);
            width: min(460px, calc(100vw - 32px));
            max-height: 90vh;
            box-shadow: var(--elev-lg);
        }

        dialog::backdrop {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        dialog h2 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .dact {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .empty {
            text-align: center;
            padding: 56px 16px;
            color: var(--on-sv);
        }

        .empty h3 {
            color: var(--on-s);
            margin-bottom: 8px;
        }

        .empty .btn {
            margin-top: 18px;
        }

        .about h3 {
            font-size: 18px;
            margin: 26px 0 8px;
        }

        .about p {
            color: var(--on-sv);
            line-height: 1.6;
        }

        .about .chips {
            flex-wrap: wrap;
            overflow: visible;
        }

        @media print {

            .bottombar,
            .rail,
            .appbar,
            .fab,
            .acts {
                display: none !important;
            }

            main {
                margin: 0;
                padding: 0;
            }

            .cert {
                box-shadow: none;
                border-color: #000;
            }
        }
    </style>
</head>

            function qr(seed) {
                var n = 21, cells = '', r = seed * 9301 + 49297;
                function rnd() { r = (r * 9301 + 49297) % 233280; return r / 233280 }
                function fin(x, y) { return (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7) }
                for (var y = 0; y < n; y++) {
                    for (var x = 0; x < n; x++) {
                        var on;
                        if (fin(x, y)) {
                            var fx = x % (n - 7 > x ? n : n - 7), lx = x >= n - 7 ? x - (n - 7) : x, ly = y >= n - 7 ? y - (n - 7) : y;
                            on = lx === 0 || lx === 6 || ly === 0 || ly === 6 || (lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4);
                        } else {
                            on = rnd() > 0.5;
                        }
                        if (on) cells += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
                    }
                }
                return '<svg class="qr" viewBox="0 0 21 21" fill="currentColor" aria-label="Kode verifikasi blockchain" role="img">' + cells + '</svg>';

                        '\nVolume dialihkan dari TPA: ' + num(t.qty) + ' kg' +
                        '\nEmisi GRK dihemat: ' + num(t.qty * m.f) + ' kg CO2e' +
                        '\nTanggal Transaksi: ' + fmtDate(t.date) +
                        '\nPlatform: Circula Marketplace Limbah Industri Sirkular';
                    try {
                        navigator.clipboard.writeText(txt).then(function () {
                            snack('Ringkasan ESG berhasil disalin ke clipboard');
                        }, function () {
                            snack('Salin otomatis tidak didukung di browser ini');
                        });
                    } catch (e) {
                        snack('Salin otomatis tidak didukung di browser ini');
                    }
                },
                print: function () {
                    try { window.print() } catch (e) { snack('Fitur cetak tidak tersedia') }
                },
                setRole: function (el) {
                    S.user.role = el.dataset.v;
                    S.ui.peta.mode = null;
                    save();
                    render();
                    snack('Peran akun beralih ke: ' + (S.user.role === 'penghasil' ? 'Penghasil Limbah' : 'Pembeli Bahan Baku'));
                },
                theme: function (el) {
                    S.theme = el.dataset.v;
                    applyTheme();
                    save();
                    render();
                },
                reset: function () {
                    S.mine = [];
                    S.favs = [];
                    seed();
                    save();
                    render();
                    snack('Data demo berhasil diatur ulang ke kondisi awal');
                },
                logout: function () {
                    S.seen = false;
                    save();
                    location.hash = '#/splash';
                }
            };

            document.addEventListener('click', function (e) {
                var el = e.target.closest('[data-act]');
                if (!el) return;
                var f = ACT[el.dataset.act];
                if (!f) return;
                if (el.dataset.act === 'fav' || el.dataset.act === 'contactBuyer') {
                    e.preventDefault();
                    e.stopPropagation();
                }
                f(el);
            });

            dlg.addEventListener('click', function (e) { if (e.target === dlg) closeDlg() });
            window.addEventListener('hashchange', render);
            render();
        })();
    </script>
</body>

</html>
